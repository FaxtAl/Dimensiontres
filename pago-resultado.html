<script src="cart.js?v=stock-real-sin-pedido-20260715"></script>
<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var status = (params.get('collection_status') || params.get('status') || '').toLowerCase();
    var order = params.get('order') || params.get('external_reference') || localStorage.getItem('dt_last_order_reference') || '';

    var state = 'pending';
    if (status === 'approved' || status === 'success') state = 'success';
    if (status === 'rejected' || status === 'failure' || status === 'cancelled') state = 'failure';

    var icon = document.getElementById('result-icon');
    var kicker = document.getElementById('result-kicker');
    var title = document.getElementById('result-title');
    var copy = document.getElementById('result-copy');
    var ref = document.getElementById('result-ref');

    if (state === 'success') {
      icon.textContent = 'check_circle';
      kicker.textContent = 'Pago aprobado';
      title.textContent = 'Pedido confirmado';
      copy.textContent = 'Gracias por tu compra. Guardamos el pedido y lo vamos a preparar para coordinar entrega o retiro.';
      try {
        localStorage.removeItem('dt_cart_v1');
        if (typeof updateCartBadge === 'function') updateCartBadge();
      } catch (error) {}
    } else if (state === 'failure') {
      icon.textContent = 'error';
      kicker.textContent = 'Pago no aprobado';
      title.textContent = 'No se pudo cobrar';
      copy.textContent = 'No se desconto ningun pago confirmado. Podes volver al carrito e intentar de nuevo o coordinar por WhatsApp.';
    } else {
      icon.textContent = 'hourglass_top';
      kicker.textContent = 'Pago pendiente';
      title.textContent = 'Estamos revisando';
      copy.textContent = 'Mercado Pago todavia esta procesando la operacion. El pedido se actualiza solo cuando llegue la confirmacion.';
    }

    if (order) {
      ref.hidden = false;
      ref.textContent = 'Pedido ' + order;
    }
  })();
</script>

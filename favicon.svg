<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DimensionTres">
  <title>DimensionTres</title>
  <!-- Mismos colores que .btn-primary del sitio: degrade cyan sobre verde oscuro. -->
  <defs>
    <linearGradient id="d3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff5ff"/>
      <stop offset="1" stop-color="#00eefc"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#d3)"/>
  <!-- D3 inclinado, igual que el logotipo en italica del encabezado. -->
  <g transform="translate(32,32) scale(0.85) skewX(-9) translate(-34.5,-32)"
     fill="none" stroke="#003f43" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 18 H23 A14 14 0 0 1 23 46 H14 Z"/>
    <path d="M42 18 H48 A7 7 0 0 1 48 32 A7 7 0 0 1 48 46 H42"/>
  </g>
</svg>
